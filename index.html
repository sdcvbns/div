<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة اصطياد البث</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 380px;
      padding: 10px;
      background-color: #1e1e2e;
      color: #cdd6f4;
      margin: 0;
    }
    .container {
      background: #313244;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    h2 {
      font-size: 15px;
      color: #a6e3a1;
      margin-top: 0;
      border-bottom: 2px solid #89b4fa;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .btn-clear {
      width: 100%;
      background-color: #f38ba8;
      color: #11111b;
      border: none;
      padding: 8px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .links-list {
      max-height: 250px;
      overflow-y: auto;
    }
    .link-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #45475a;
      padding: 8px;
      margin-bottom: 6px;
      border-radius: 5px;
      border-right: 4px solid #a6e3a1;
    }
    .link-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 260px;
      direction: ltr;
      text-align: left;
      font-size: 12px;
    }
    .btn-copy {
      background: #89b4fa;
      color: #11111b;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }
    .no-links {
      text-align: center;
      color: #6c757d;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎯 الروابط المكتشفة بالخلفية</h2>
    <button id="clearBtn" class="btn-clear">مسح الروابط الحالية</button>
    <div id="linksContainer" class="links-list">
      <p class="no-links">بانتظار تشغيل أي بث أو فيديو في المتصفح...</p>
    </div>
  </div>

  <script strain="local">
    document.addEventListener("DOMContentLoaded", function() {
      const container = document.getElementById("linksContainer");
      const clearBtn = document.getElementById("clearBtn");

      function updateUI() {
        chrome.storage.local.get({ capturedLinks: [] }, function(result) {
          const links = result.capturedLinks;
          container.innerHTML = "";

          if (links.length === 0) {
            container.innerHTML = '<p class="no-links">بانتظار تشغيل أي بث أو فيديو في المتصفح...</p>';
            return;
          }

          links.forEach((link) => {
            const item = document.createElement("div");
            item.className = "link-item";

            const textSpan = document.createElement("span");
            textSpan.className = "link-text";
            textSpan.textContent = link;
            textSpan.title = link;

            const copyBtn = document.createElement("button");
            copyBtn.className = "btn-copy";
            copyBtn.textContent = "نسخ";
            copyBtn.addEventListener("click", () => {
              navigator.clipboard.writeText(link);
              copyBtn.textContent = "تم!";
              setTimeout(() => { copyBtn.textContent = "نسخ"; }, 1000);
            });

            item.appendChild(textSpan);
            item.appendChild(copyBtn);
            container.appendChild(item);
          });
        });
      }

      clearBtn.addEventListener("click", function() {
        chrome.storage.local.set({ capturedLinks: [] }, updateUI);
      });

      // جلب الروابط وتحديث القائمة عند فتح الواجهة
      updateUI();
    });
  </script>
</body>
</html>
