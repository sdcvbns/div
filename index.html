<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>متصفح مستخرج البث الذكي</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 700px; /* قمنا بتوسيع الحجم ليتسع للمتصفح والروابط معا */
      height: 550px;
      padding: 10px;
      background-color: #1e1e2e;
      color: #cdd6f4;
      margin: 0;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* شريط عنوان المتصفح الداخلي */
    .browser-bar {
      display: flex;
      gap: 5px;
      background: #313244;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .browser-bar input {
      flex: 1;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      background: #45475a;
      color: #fff;
      direction: ltr;
    }

    .browser-bar button {
      background: #89b4fa;
      color: #11111b;
      border: none;
      padding: 6px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    /* إطار المتصفح الداخلي */
    .browser-frame-container {
      flex: 1;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      min-height: 250px;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* قسم الروابط المكتشفة */
    .results-section {
      height: 180px;
      margin-top: 10px;
      background: #313244;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    h2 {
      font-size: 14px;
      margin: 0 0 8px 0;
      display: flex;
      justify-content: space-between;
      color: #a6e3a1;
    }

    .links-list {
      flex: 1;
      overflow-y: auto;
    }

    .link-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #45475a;
      padding: 6px 10px;
      margin-bottom: 5px;
      border-radius: 4px;
      font-size: 11px;
    }

    .link-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 520px;
      direction: ltr;
      text-align: left;
    }

    .btn-copy {
      background: #a6e3a1;
      color: #11111b;
      border: none;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
    }

    .no-links {
      text-align: center;
      color: #6c757d;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- شريط تصفح المواقع -->
    <div class="browser-bar">
      <input type="text" id="urlInput" value="https://www.w3schools.com/html/html5_video.asp" placeholder="أدخل رابط موقع الأفلام أو البث هنا...">
      <button id="goBtn">انتقال</button>
    </div>

    <!-- المتصفح الداخلي -->
    <div class="browser-frame-container">
      <iframe id="browserFrame" src="https://www.w3schools.com/html/html5_video.asp" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
    </div>

    <!-- قسم عرض الروابط المستخرجة -->
    <div class="results-section">
      <h2>
        <span>🎯 الروابط الملتقطة داخل المتصفح:</span>
        <button id="clearBtn" style="background:transparent; border:none; color:#f38ba8; cursor:pointer; font-size:11px;">مسح القائمة</button>
      </h2>
      <div id="linksContainer" class="links-list">
        <p class="no-links">تصفح المواقع وشغّل أي فيديو ليتم اصطياد الرابط هنا...</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const iframe = document.getElementById("browserFrame");
      const urlInput = document.getElementById("urlInput");
      const goBtn = document.getElementById("goBtn");
      const container = document.getElementById("linksContainer");
      const clearBtn = document.getElementById("clearBtn");
      
      let capturedUrls = new Set();

      // زر الانتقال للموقع المكتوب
      goBtn.addEventListener("click", function() {
        let url = urlInput.value.trim();
        if (!url.startsWith("http://") && !url.startsWith("https://")) {
          url = "https://" + url;
        }
        urlInput.value = url;
        iframe.src = url;
      });

      // دالة لإضافة الرابط المكتشف للواجهة
      function addLink(url) {
        if (capturedUrls.has(url)) return; // منع التكرار
        capturedUrls.add(url);

        if (capturedUrls.size === 1) container.innerHTML = "";

        const item = document.createElement("div");
        item.className = "link-item";

        const textSpan = document.createElement("span");
        textSpan.className = "link-text";
        textSpan.textContent = url;
        textSpan.title = url;

        const copyBtn = document.createElement("button");
        copyBtn.className = "btn-copy";
        copyBtn.textContent = "نسخ";
        copyBtn.addEventListener("click", () => {
          navigator.clipboard.writeText(url);
          copyBtn.textContent = "تم!";
          setTimeout(() => { copyBtn.textContent = "نسخ"; }, 1000);
        });

        item.appendChild(textSpan);
        item.appendChild(copyBtn);
        container.appendChild(item);
      }

      // آلية الاصطياد: فحص حركة طلبات المتصفح الداخلي (إذا تم تشغيله كإضافة)
      if (typeof chrome !== "undefined" && chrome.webRequest) {
        chrome.webRequest.onBeforeRequest.addListener(
          function(details) {
            const url = details.url;
            if (url.includes(".m3u8") || url.includes(".mp4") || url.includes(".mkv")) {
              addLink(url);
            }
          },
          { urls: ["<all_urls>"] }
        );
      }

      // آلية اصطياد احتياطية: فحص عناصر الفيديو داخل الـ iframe مباشرة في حال سمح الموقع بذلك
      iframe.addEventListener("load", function() {
        try {
          const iframeWindow = iframe.contentWindow;
          
          // 1. مراقبة مشغلات الفيديو الافتراضية HTML5
          const videos = iframe.contentDocument.getElementsByTagName("video");
          for (let img of videos) {
            if (img.src) addLink(img.src);
          }

          // 2. اعتراض طلبات الـ Fetch والـ XHR داخل الـ iframe لاصطياد الروابط المخفية
          const originalFetch = iframeWindow.fetch;
          iframeWindow.fetch = async function(...args) {
            const url = args[0];
            if (typeof url === 'string' && (url.includes(".m3u8") || url.includes(".mp4"))) {
              addLink(url);
            }
            return originalFetch.apply(this, args);
          };
        } catch (e) {
          console.log("القيود الأمنية للموقع تمنع الفحص المباشر، يعتمد البرنامج الآن على شبكة المتصفح الأساسية (WebRequest).");
        }
      });

      // مسح القائمة
      clearBtn.addEventListener("click", function() {
        capturedUrls.clear();
        container.innerHTML = '<p class="no-links">تصفح المواقع وشغّل أي فيديو ليتم اصطياد الرابط هنا...</p>';
      });
    });
  </script>
</body>
</html>
